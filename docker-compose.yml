# Docker Compose pour le pipeline crypto
# Usage: docker-compose up -d

version: '3.8'

# Variables communes pour Airflow
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://crypto_user:crypto_pass@postgres:5432/crypto_db
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    # Variables pour nos scripts
    CRYPTO_DB_HOST: postgres
    CRYPTO_DB_PORT: 5432
    CRYPTO_DB_NAME: crypto_db
    CRYPTO_DB_USER: crypto_user
    CRYPTO_DB_PASSWORD: crypto_pass
  volumes:
    - ./dags:/opt/airflow/dags                # Nos DAGs
    - ./src:/opt/airflow/src                  # Nos scripts Python
    - ./data:/opt/airflow/data                # Nos données
    - airflow_logs:/opt/airflow/logs          # Logs Airflow
  user: "50000:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ==========================================================================
  # PostgreSQL - Base de données
  # ==========================================================================
  postgres:
    image: postgres:15
    container_name: crypto_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crypto_user
      POSTGRES_PASSWORD: crypto_pass
      POSTGRES_DB: crypto_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto_user -d crypto_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Airflow - Init (exécuté une seule fois pour initialiser la DB)
  # ==========================================================================
  airflow-init:
    <<: *airflow-common
    container_name: crypto_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        # Créer l'utilisateur admin
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    restart: "no"

  # ==========================================================================
  # Airflow Webserver - Interface web
  # ==========================================================================
  airflow-webserver:
    <<: *airflow-common
    container_name: crypto_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"                            # Interface web sur http://localhost:8080
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ==========================================================================
  # Airflow Scheduler - Planificateur de tâches
  # ==========================================================================
  airflow-scheduler:
    <<: *airflow-common
    container_name: crypto_airflow_scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

# ==========================================================================
# Volumes persistants
# ==========================================================================
volumes:
  postgres_data:
  airflow_logs:
